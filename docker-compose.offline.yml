# ThreatNeXus — network-unavailable rehearsal overlay (Phase 7).
#
# WHY THIS EXISTS
#   The demonstration must work in a room with no usable internet. Claiming that
#   because "the code does not call out" is weaker than showing it: the point of
#   a rehearsal is to be surprised in private rather than in front of an
#   audience.
#
# WHAT IT DOES
#   Blackholes every external host the backend could ever reach — the eight
#   intelligence providers (added Censys, Phase 8B; GreyNoise, Phase 8D;
#   Shodan, Phase 8E; Netlas, Phase 8F) — by resolving them to 0.0.0.0 inside
#   the container. Any attempt to reach one fails immediately rather than
#   hanging, which is also the faster failure mode to observe.
#
#   Container-to-container traffic (backend -> postgres) and the published ports
#   are untouched, so the stack is still observable from the host. That is
#   deliberate: a fully `internal: true` network would also sever the published
#   ports and you would be rehearsing "can I see the demo", not "does the demo
#   work offline".
#
# USE
#   JWT_SECRET="..." docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml \
#     exec -e DEMO_MODE=true -e DEMO_USER_PASSWORD='...' backend npm run seed:demo
#
# EXPECTED RESULT
#   Identical to the online rehearsal. Ingestion, ownership, risk, cases,
#   notifications, approval and export all complete; enrichment records that the
#   provider was unavailable and blocks nothing. If any figure differs from the
#   online run, that is a finding.

services:
  backend:
    extra_hosts:
      - "api.abuseipdb.com:0.0.0.0"
      - "services.nvd.nist.gov:0.0.0.0"
      - "www.cisa.gov:0.0.0.0"
      - "api.first.org:0.0.0.0"
      - "api.platform.censys.io:0.0.0.0"
      - "api.greynoise.io:0.0.0.0"
      - "api.shodan.io:0.0.0.0"
      - "app.netlas.io:0.0.0.0"
    environment:
      # Stated explicitly rather than inherited, so the rehearsal cannot
      # accidentally run with a key that a shell happened to export.
      ABUSEIPDB_API_KEY: ""
      NVD_API_KEY: ""
      CENSYS_PAT: ""
      CENSYS_ORG_ID: ""
      GREYNOISE_API_KEY: ""
      SHODAN_API_KEY: ""
      NETLAS_API_KEY: ""
      IOC_ENRICHMENT_PROVIDER: mock
      AI_ENABLED: "false"
      AI_PROVIDER: "null"
