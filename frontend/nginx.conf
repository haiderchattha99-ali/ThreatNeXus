# ThreatNeXus frontend — static bundle server.
#
# ---------------------------------------------------------------------------
# Why the cache policy is a `map` and not a per-location `add_header`
# ---------------------------------------------------------------------------
# nginx does NOT merge `add_header` down a level. From the ngx_http_headers
# module: these directives are inherited from the previous configuration level
# "if and only if there are no add_header directives defined on the current
# level". The earlier version of this file declared the three security headers
# at `server` level and a Cache-Control `add_header` inside both
# `location /assets/` and `location = /index.html` — so each of those two
# blocks silently discarded ALL of them.
#
# That was not a corner case. `location /` serves the SPA by falling through to
# /index.html, and try_files' last argument is an internal redirect, so the
# request re-enters location matching and lands on `location = /index.html`.
# Every HTML document the application ever served — `/`, `/index.html` and
# every client-side route — therefore carried no X-Frame-Options, no
# X-Content-Type-Options and no Referrer-Policy, and every hashed asset carried
# none either. Measured on a running container, not inferred.
#
# The fix is structural rather than a repetition of the headers in each block:
# with the cache policy computed here, the server block owns the ONLY
# `add_header` level in the file, so there is no lower level left to shadow it.
# Adding a header below this comment cannot be silently dropped, and adding a
# future `location` cannot silently drop one either — unless it introduces an
# `add_header` of its own, which is the one thing this file no longer needs to
# do.
map $uri $tnx_cache_control {
    # index.html must never be cached, or a deployed fix keeps loading the
    # previous bundle. Everything not matched below is treated the same way.
    default    "no-store";
    # Asset filenames carry a content hash, so a given URI is immutable.
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $tnx_cache_control always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # frame-ancestors is the control that actually stops clickjacking of the
    # analyst console; X-Frame-Options above is kept as the legacy equivalent.
    # An analyst's session is a bearer token in localStorage, which a
    # same-origin frame keeps, so a framed console is a live console.
    #
    # Deliberately NO default-src / script-src / connect-src. The bundle talks
    # to an API whose origin is chosen at BUILD time (VITE_API_BASE_URL) and is
    # normally a different origin from this server, so any directive that
    # constrains connect-src would have to be generated per deployment — and a
    # CSP that is wrong for a deployment gets switched off rather than fixed.
    # These four directives need no such knowledge, break nothing, and close
    # the framing, base-tag, plugin and form-exfiltration paths.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Single-page application: any unknown path is handled by the client
    # router, so it must fall through to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
