# ThreatNeXus — local development and demonstration stack.
#
# WHAT THIS IS
#   PostgreSQL + backend + frontend, for a developer's own machine or a
#   demonstration. It is NOT a deployment: ThreatNeXus is a research prototype
#   and there is no production compose file.
#
# QUICK START
#   1. Bring the stack up (the backend applies migrations on start):
#        JWT_SECRET="$(openssl rand -base64 48)" docker compose up --build
#   2. Create the four local accounts, once:
#        docker compose exec -e SEED_USER_PASSWORD='<a-strong-local-password>' \
#          backend npm run seed:users
#   3. Optionally load the deterministic demonstration dataset:
#        docker compose exec -e DEMO_MODE=true \
#          -e DEMO_USER_PASSWORD='<the same password>' backend npm run seed:demo
#   4. Open http://localhost:5173
#
# SECRETS
#   No secret is baked into an image or committed here. JWT_SECRET has no
#   default — the backend refuses to start without one, which is deliberate.
#   Provider keys are optional and are only ever read by the backend.
#
# DATA SAFETY
#   Nothing here resets, truncates or drops a database. `migrate deploy` only
#   applies migrations that have not been applied yet. To start clean, remove
#   the named volume explicitly:
#        docker compose down -v
#
# PORT CONFLICT
#   If an older container is holding 5432, stop it first:
#        docker stop threatnexus-phase0-postgres
#
# CONTAINER NAMES
#   Deliberately NOT pinned with `container_name`. Phase 7's clean-stack proof
#   failed on exactly that: a leftover exited container from a previous session
#   still owned the name "threatnexus-postgres", so `docker compose up --build`
#   from a fresh checkout aborted with a name conflict even though the images
#   built correctly and no port was in use. A hardcoded container_name is also
#   what stops two checkouts (or a `-p` project name) from coexisting. Compose
#   now derives names as <project>-<service>-1. Address services by SERVICE
#   name — `docker compose exec postgres ...` — which is stable either way.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatnexus
      POSTGRES_USER: threatnexus
      # Local development default only — never used outside a developer's own
      # machine. Override by exporting POSTGRES_PASSWORD before running
      # `docker compose up` if you want a different local value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatnexus_local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - threatnexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatnexus -d threatnexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Waits for the health check above, not merely for the container to
        # exist — otherwise the first migrate would race the database's own
        # startup and fail on a cold machine.
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://threatnexus:${POSTGRES_PASSWORD:-threatnexus_local_dev_only}@postgres:5432/threatnexus?schema=public
      # REQUIRED and deliberately un-defaulted. `docker compose up` fails fast
      # with a clear message rather than starting with a guessable secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. JWT_SECRET="$(openssl rand -base64 48)" docker compose up}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      REPORT_MAX_ROWS: ${REPORT_MAX_ROWS:-5000}
      # Providers are OPTIONAL. With no key the application still starts and
      # every core workflow still completes; enrichment simply records that the
      # provider was unavailable. Pass a key from your own shell if you want to
      # exercise a real provider — never write one into this file.
      IOC_ENRICHMENT_PROVIDER: ${IOC_ENRICHMENT_PROVIDER:-mock}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      CENSYS_PAT: ${CENSYS_PAT:-}
      CENSYS_ORG_ID: ${CENSYS_ORG_ID:-}
      # AI is off by default and there is no live provider in this repository.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-null}
      # Where the fixture CSVs are mounted (see the volumes block below). Set
      # explicitly because the seed script's relative walk assumes the
      # repository layout, and the image has no backend/ level in its paths.
      TNX_DATA_DIR: /app/data
      # Rate limiting (Phase 7). Defaults are the application's own; they are
      # surfaced here because one legitimate workload genuinely exceeds them:
      # the Chromium browser suite performs dozens of real sign-ins in a few
      # minutes, which is indistinguishable from credential stuffing and is
      # correctly refused. Raise RATE_LIMIT_AUTH_MAX for that run rather than
      # lowering the control for everyone —
      #   RATE_LIMIT_AUTH_MAX=1000 docker compose up -d
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-30}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-20}
      RATE_LIMIT_PROVIDER_MAX: ${RATE_LIMIT_PROVIDER_MAX:-60}
    ports:
      - "5000:5000"
    volumes:
      # The synthetic and demonstration CSV fixtures, read-only.
      #
      # They are NOT baked into the image on purpose — data is not code, and the
      # image should stay reproducible from source alone. But the demo seed
      # reads them from the repository at run time, so without this mount
      # `npm run seed:demo` inside the container found nothing, ingested
      # nothing, and reported "findings total=0" while exiting 0. The Phase 7
      # clean-stack proof hit exactly that: a completely empty demonstration in
      # which every command had reported success.
      #
      # Read-only because the container has no business writing to the
      # repository's fixtures.
      - ./data:/app/data:ro
    # Migrations are applied from zero on every start. `migrate deploy` is the
    # non-interactive, non-destructive command: it never resets and never
    # generates a new migration.
    command: sh -c "npx prisma migrate deploy && node server.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. Non-secret by construction — CI
        # fails the build if anything secret-shaped reaches the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # 5173 matches the Vite dev port, so CORS_ORIGIN and any bookmarked URL
      # work the same whether the frontend is containerised or run with
      # `npm run dev`.
      - "5173:80"

volumes:
  threatnexus_postgres_data:
