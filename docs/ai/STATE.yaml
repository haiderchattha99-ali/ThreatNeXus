    "root_cause": "SEC-01 (P0): POST /api/auth/register was open AND a self-registered account is a VIEWER, which holds read:dashboard/read:findings/read:cases. Each decision is defensible alone; composed they let any anonymous caller create an account and read every finding (victim address, port, owning organization), every case (including analyst email addresses) and the dashboard - two unauthenticated requests, no user interaction. The frontend never called the route at all. SEC-02 (P1): nginx does not merge add_header down a level - it inherits ONLY if the current level defines none. server-level security headers were therefore discarded by the two location blocks that declared their own Cache-Control add_header, and because location / serves the SPA through try_files whose last argument is an internal redirect, EVERY HTML document landed on location = /index.html. All documents and all hashed assets shipped with no X-Frame-Options, no X-Content-Type-Options, no Referrer-Policy and no CSP. SEC-03 (P2): parseResourceId bounded ids with Number.isSafeInteger (2^53-1) while every id column is PostgreSQL int4 (2^31-1), so values in between passed validation and reached Prisma as an unhandled error - 500 on 13 entity-by-id routes where 2147483647 correctly returned 404.",
    "final_contract": "ALLOW_PUBLIC_REGISTRATION defaults false in EVERY environment including test; the route stays mounted and answers an audited 403 before any user lookup or bcrypt work. nginx computes cache policy with a map on $uri so the server block is the only add_header level in the file, plus a CSP of frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' - deliberately no default-src/script-src/connect-src, because the API origin is a build-time value and a per-deployment CSP that breaks gets switched off rather than fixed. MAX_RESOURCE_ID=2147483647 bounds parseResourceId for all 19 calling modules and the duplicate parser in findingReadController.js is deleted. No authorization decision, capability grant, workflow rule, schema, migration or provider behaviour was changed."
