    "root_cause":  "frontend/src/pages/Upload.jsx called threatService.uploadCSV(), which posts to the LEGACY POST /api/threats/upload route. That route runs threatController.uploadThreatCSV and writes standalone Threat rows: no RawReport, no RawReportRow evidence, no Finding, no FindingOccurrence, no ownership resolution, no enrichment scheduling, no risk recalculation and no report.ingestion.* audit event. The page then rendered a \u0027Report processed\u0027 heading from that route\u0027s \u0027N threat(s) added successfully\u0027 message, so an upload reported success while the Findings workspace, the occurrence history and the operational overview received nothing. Upload.jsx already read result.findingCounts - a field only the CANONICAL controller returns - so the lifecycle chips were dead code against the legacy response body: the page had been written for the right contract and wired to the wrong one. The old Upload.test.jsx mocked threatService.uploadCSV and asserted it was called, which is structurally incapable of noticing the wrong route, and the old E2E asserted only that the heading \u0027Report processed\u0027 appeared.",
    "final_contract":  "POST /api/reports/upload (frontend: reportIngestionService.uploadReport). multipart/form-data carrying exactly one field, \u0027file\u0027. source (SYNTHETIC_UPLOAD), reportType (ACCESSIBLE_RDP) and schemaVersion (accessible-rdp.synthetic.v1) remain server-decided in reportIngestionController.js and are read from no request field. Outcomes are read from the status the controller assigns, one per closed INGESTION_OUTCOMES member: 201 PROCESSED, 200 DUPLICATE_COMPLETED, 409 DUPLICATE_IN_PROGRESS, 400 REJECTED, 422 UNPROCESSABLE_NO_VALID_ROWS, 500 FAILED, plus 413/429/403 and a no-response transport failure classified separately as refusals that never entered the pipeline. Backend authentication, RBAC (ingest:reports), multer ordering, upload limits, the uploadRateLimiter mount and every ingestion semantic are unchanged. The legacy /api/threats/upload route is left mounted and untouched.",
