    "root_cause":  "The read-only rendered audit at 702afee scored the product 7/10 and found the deficits were about ORDER and LANGUAGE, not about missing evidence. FindingDetail was ~3,700px with 'Record triage' LAST, below a disabled AI panel and an all-empty provider table, so the one control that moves work forward sat below everything that was not the decision. The truth layer leaked storage format: FACTOR_LABEL in FindingDetail.jsx was keyed on EXPOSURE_BASE/IOC_REPUTATION/EPSS_PROBABILITY while the engine stores exposureCriticality/iocReputationContext/epssScore, so not one key ever matched, the dictionary was dead code, and raw camelCase storage keys rendered at analysts; explanation codes rendered raw beside them. A second shipped defect: ProtectedRoute rendered its own '403 - Access Denied' card, so the product shipped TWO refusal dialects depending on whether a route or a panel refused, and the crafted accessible DeniedState in ui/States.jsx was bypassed at the route level. Findings rows were not clickable at all (measured: cursor auto, no handler), the risk band was the quietest element in a row while status/lifecycle chips shouted, hover was a 4% tint that is invisible on a near-black canvas, and amber carried three unrelated meanings in one row (OPEN status, PERSISTED lifecycle, HIGH band). Loading used a generic three-bar skeleton that popped into layout, and route changes hard-swapped with no scroll reset.",
    "final_contract":  "Frontend only. Zero backend, database, migration, auth, capability or provider change — `git status --porcelain backend/` is empty and no package.json anywhere was touched, so no dependency was added (explicitly: no Motion, anime.js, Lenis, Three.js, Rive or new UI kit). Every backend response shape is consumed exactly as before; the new English is a projection of already-stored values through fixed dictionaries keyed off the engine's own closed vocabularies, never generated, with the raw code still rendered beside the sentence so provenance is added to rather than traded away. Risk v1 band colours remain frozen and identical. Login, Cases, Settings and the mobile table treatment are untouched per the brief.",
